<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BIET - Verified Neighbor Matrix Engine</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #080808; color: #eee; padding: 20px; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1000px; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .header { background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #333; display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; align-items: center; }
        .config-group { display: flex; flex-direction: column; gap: 5px; }
        .card { background: #111; padding: 20px; border-radius: 12px; border: 1px solid #222; border-top: 5px solid #e74c3c; transition: border-color 0.3s; }
        .card.active { border-top-color: #2ecc71; }
        
        .tracker-box { background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid #444; display: flex; flex-direction: column; gap: 8px; }
        .tracker-stream { display: flex; gap: 8px; justify-content: flex-start; align-items: center; background: #111; padding: 12px; border-radius: 6px; border: 1px solid #222; min-height: 24px; overflow-x: auto; }
        
        .stream-badge { min-width: 35px; height: 26px; padding: 0 6px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-family: monospace; font-size: 14px; font-weight: bold; }
        .stream-hit { background: rgba(46, 204, 113, 0.2); border: 1px solid #2ecc71; color: #2ecc71; }
        .stream-miss { background: #222; border: 1px solid #333; color: #777; }

        .fin-row { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .label { font-size: 10px; color: #777; text-transform: uppercase; letter-spacing: 1px; }
        .val { font-family: monospace; font-weight: bold; font-size: 18px; }
        .win { color: #2ecc71; } .loss { color: #e74c3c; }
        
        .notation-area { background: #000; padding: 15px; border-radius: 8px; margin-top: 15px; min-height: 60px; border: 1px inset #222; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-content: center; }
        .p-block { padding: 8px 16px; border-radius: 6px; font-size: 20px; font-weight: bold; border: 2px solid #3498db; color: #3498db; background: rgba(52, 152, 219, 0.1); text-align: center; }
        .p-block.imaginary { border-color: #e67e22; color: #e67e22; background: rgba(230, 126, 34, 0.1); }
        
        .table-wrapper { background: #052c14; padding: 15px; border-radius: 8px; border: 3px solid #b38f46; display: flex; overflow-x: auto; }
        .num-grid { display: grid; grid-template-rows: repeat(3, 50px); grid-auto-flow: column; gap: 4px; }
        .zero-container { display: flex; margin-right: 4px; }
        .z-btn { width: 55px; height: 158px; border: 1px solid #fff; border-radius: 4px 0 0 4px; font-weight: bold; cursor: pointer; color: white; font-size: 18px; background: #27ae60; }
        .n-btn { width: 55px; height: 50px; border: 1px solid #fff; border-radius: 2px; font-weight: bold; cursor: pointer; color: white; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: background 0.1s; }
        .n-btn:active, .z-btn:active { transform: scale(0.96); }
        
        .red { background: #c0392b; } .black { background: #1c2833; }
        .status-msg { font-size: 11px; text-align: center; color: #777; margin-top: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="grid">
        <div class="header">
            <div class="config-group">
                <span class="label">Last Number</span>
                <div id="lastNum" style="font-size:28px; font-weight:bold; color:#f1c40f">--</div>
            </div>
            <div class="config-group" style="text-align:right">
                <span class="label">Total Net P/L</span>
                <span id="netTotal" class="val">0.00</span>
            </div>
        </div>

        <div class="tracker-box">
            <span class="label">Operator Stream (Last 12 Spins)</span>
            <div class="tracker-stream" id="globalStream"></div>
        </div>

        <div class="card" id="mainCard">
            <span class="label">Triggered Family Notation Targets</span>
            <div class="notation-area" id="pNot"></div>
            <div id="pStatus" class="status-msg">WAITING FOR FREQUENCY MATCH...</div>
        </div>

        <div class="table-wrapper">
            <div class="zero-container">
                <button class="z-btn" onclick="inputNum(0)">0</button>
            </div>
            <div class="num-grid" id="grid"></div>
        </div>

        <div style="display: flex; gap: 10px;">
            <button onclick="undo()" style="background:#d35400; flex:1; padding:12px; color:white; border:0; border-radius:6px; cursor:pointer;">UNDO</button>
            <button onclick="location.reload()" style="background:#333; flex:1; padding:12px; color:white; border:0; border-radius:6px; cursor:pointer;">RESET</button>
        </div>
    </div>
</div>

<script>
    const euWheel = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
    const termMap = { 1:[8], 2:[7,9], 3:[8], 4:[11], 5:[10,12], 6:[11], 7:[2,9], 8:[1,3,13,15], 9:[2,14], 10:[5,17], 11:[4,6,16,18], 12:[5,17], 13:[8,20], 14:[7,9,19,21], 15:[8,20], 16:[11,23], 17:[10,12,22,24], 18:[11,23], 19:[14,26], 20:[13,15,25,27], 21:[14,26], 22:[17,29], 23:[16,18,28,30], 24:[17,29], 25:[20,32], 26:[19,21,31,33], 27:[20,32], 28:[23,35], 29:[22,24,34,36], 30:[23,35], 31:[26], 32:[25,27], 33:[26], 34:[29], 35:[28,30], 36:[29] };
    const operators = ["+2", "-2", "+3", "-3", "+4", "-4", "+5", "-5"];

    let history = [], stateHistory = [];
    let globalStreamHistory = [];
    
    let fin = { 
        pl: 0, 
        activeNumbers: [], 
        displayBlocks: []
    };

    const g = document.getElementById('grid');
    const redNumbers = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
    
    for (let col = 1; col <= 12; col++) {
        let n1 = col * 3; let n2 = n1 - 1; let n3 = n1 - 2;
        [n1, n2, n3].forEach(num => {
            let b = document.createElement('button');
            b.innerText = num;
            b.className = `n-btn ${redNumbers.includes(num) ? 'red' : 'black'}`;
            b.onclick = () => inputNum(num);
            g.appendChild(b);
        });
    }

    function getWheelNeighbors(num, count) {
        let results = [];
        let idx = euWheel.indexOf(num);
        if (idx === -1) return [];
        for (let i = -count; i <= count; i++) {
            let neighborIdx = (idx + i + 37) % 37;
            results.push(euWheel[neighborIdx]);
        }
        return results;
    }

    function parseOp(opStr, val) {
        return val + parseInt(opStr);
    }

    function getOperatorTargetsData(op, referenceNumber) {
        let targetSet = new Set();
        let displayBlocks = [];
        let imaginaryNo = parseOp(op, referenceNumber);
        
        if (imaginaryNo >= 0 && imaginaryNo <= 36) {
            getWheelNeighbors(imaginaryNo, 1).forEach(n => targetSet.add(n));
            displayBlocks.push({ text: `${imaginaryNo}n1`, isImaginary: true });
            
            if (termMap[imaginaryNo]) {
                let terminals = termMap[imaginaryNo];
                let neighborCount = (terminals.length > 2) ? 2 : (terminals.length === 1 ? 5 : 3);
                
                terminals.forEach(termNum => {
                    getWheelNeighbors(termNum, neighborCount).forEach(n => targetSet.add(n));
                    displayBlocks.push({ text: `${termNum}n${neighborCount}`, isImaginary: false });
                });
            }
        }
        return { numbers: Array.from(targetSet), blocks: displayBlocks };
    }

    function inputNum(n) {
        stateHistory.push(JSON.stringify({history, fin, globalStreamHistory: [...globalStreamHistory]}));
        
        const baseStake = 10; 
        if (fin.activeNumbers.length > 0) {
            if (fin.activeNumbers.includes(n)) {
                fin.pl += (baseStake * 36) - (fin.activeNumbers.length * baseStake);
            } else {
                fin.pl -= (fin.activeNumbers.length * baseStake);
            }
        }

        if (history.length >= 1) {
            const previousSpinReference = history[history.length - 1];
            let matchedOp = "_";
            
            for (let i = 0; i < operators.length; i++) {
                let op = operators[i];
                let footprint = getOperatorTargetsData(op, previousSpinReference).numbers;
                if (footprint.includes(n)) {
                    matchedOp = op;
                    break;
                }
            }
            
            globalStreamHistory.push(matchedOp);
            if (globalStreamHistory.length > 12) {
                globalStreamHistory.shift();
            }
        }

        history.push(n);
        let topOp = calculateFreq();
        process(topOp);
    }

    function calculateFreq() {
        let ops = {"+2":0, "-2":0, "+3":0, "-3":0, "+4":0, "-4":0, "+5":0, "-5":0};
        let start = Math.max(0, history.length - 20);
        
        for(let i = start; i < history.length - 1; i++) {
            let prev = history[i], curr = history[i+1];
            operators.forEach(op => {
                let footprint = getOperatorTargetsData(op, prev).numbers;
                if (footprint.includes(curr)) ops[op]++;
            });
        }

        let maxVal = -1, topOp = null;
        operators.forEach(op => {
            if(ops[op] > maxVal) { maxVal = ops[op]; topOp = op; }
        });
        
        if(maxVal > 0) return topOp;
        return null;
    }

    function process(topOp) {
        const last = history[history.length-1];
        const prev = history[history.length-2];
        document.getElementById('lastNum').innerText = last;
        
        fin.displayBlocks = [];
        const card = document.getElementById('mainCard');
        const status = document.getElementById('pStatus');

        if (history.length < 2 || !topOp) {
            status.innerText = "COLLECTING DATA...";
            card.classList.remove('active');
            fin.activeNumbers = [];
            updateUI(); return;
        }

        let currentFootprint = getOperatorTargetsData(topOp, prev).numbers;
        let moveFollowedFreq = currentFootprint.includes(last);

        if (moveFollowedFreq) {
            let config = getOperatorTargetsData(topOp, last);
            fin.activeNumbers = config.numbers.sort((a,b) => a-b);
            fin.displayBlocks = config.blocks;
            
            let imaginaryNo = parseOp(topOp, last);
            status.innerText = `MATCH DETECTED: IMAGINARY (${imaginaryNo}) ACTIVE`;
            status.style.color = "#2ecc71";
            card.classList.add('active');
        } else {
            status.innerText = `WAITING FOR ${topOp} TERMINAL HIT...`;
            status.style.color = "#777";
            card.classList.remove('active');
            fin.activeNumbers = [];
        }
        
        updateUI();
    }

    function updateUI() {
        document.getElementById('netTotal').innerText = fin.pl.toFixed(2);
        document.getElementById('netTotal').className = `val ${fin.pl >= 0 ? 'win' : 'loss'}`;
        
        document.getElementById('pNot').innerHTML = fin.displayBlocks
            .map(b => `<div class="p-block ${b.isImaginary ? 'imaginary' : ''}">${b.text}</div>`)
            .join('');

        let displayStream = [...globalStreamHistory];
        while(displayStream.length < 12) { displayStream.unshift(''); }

        document.getElementById('globalStream').innerHTML = displayStream.map(res => {
            if(res === '') return `<div class="stream-badge stream-miss">&nbsp;</div>`;
            if(res === '_') return `<div class="stream-badge stream-miss">_</div>`;
            return `<div class="stream-badge stream-hit">${res}</div>`;
        }).join('');
    }

    function undo() {
        if(stateHistory.length > 0) {
            let prev = JSON.parse(stateHistory.pop());
            history = prev.history; 
            fin = prev.fin; 
            globalStreamHistory = prev.globalStreamHistory;
            calculateFreq(); updateUI();
        }
    }
</script>
</body>
</html>
